# Blueprint Render untuk BinGo API.
#
# Dipakai lewat Render Dashboard -> New -> Blueprint, arahkan ke repo ini.
# Setelah tersambung, Render auto-deploy setiap push ke `main` — tidak perlu
# workflow CD terpisah untuk backend.
#
# Root direktori sengaja akar repo, bukan apps/backend: ini monorepo pnpm dan
# paket workspace (@bingo/shared-types, @bingo/shared-utils, @bingo/i18n)
# berada di luar apps/backend. Build dari akar membuat semuanya ikut.
services:
  - type: web
    name: bingo-api
    runtime: node
    region: singapore
    plan: free
    branch: main

    # pnpm dipasang eksplisit; runtime Node Render memakai npm secara bawaan.
    #
    # `prisma migrate deploy` sengaja ada di build, bukan di start. Di start ia
    # akan jalan pada SETIAP restart — termasuk setiap kali service bangun dari
    # tidur — dan menambah puluhan detik ke cold start yang sudah lambat.
    buildCommand: |
      npm install --global pnpm@10.30.3
      pnpm install --frozen-lockfile
      pnpm shared:build
      pnpm --filter @bingo/backend exec prisma generate
      pnpm --filter @bingo/backend exec prisma migrate deploy
      pnpm --filter @bingo/backend build

    startCommand: node apps/backend/dist/main.js

    # Render menyuntikkan PORT sendiri; main.ts sudah membacanya.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # sync: false = nilainya diisi manual di dashboard dan TIDAK tersimpan di
      # repo. Render akan menanyakannya saat blueprint pertama kali dibuat.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
