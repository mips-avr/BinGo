name: Android APK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_GIT_STATUS: '1'
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

jobs:
  build-apk:
    name: Test and build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile app
        run: pnpm --filter @bingo/mobile typecheck

      - name: Test mobile app
        run: pnpm --filter @bingo/mobile exec jest --runInBand

      - name: Set CI version code
        run: echo "BINGO_ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate Android native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK with CI certificate
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Package CI APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/BinGo-ci-${GITHUB_SHA::7}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-ci-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
