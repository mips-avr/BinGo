name: Android APK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_GIT_STATUS: '1'
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}

jobs:
  build-apk:
    name: Test and build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bingo
          POSTGRES_PASSWORD: bingo_dev_password
          POSTGRES_DB: bingo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo -d bingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bingo:bingo_dev_password@localhost:5432/bingo?schema=public
      JWT_SECRET: ci_test_secret_yang_panjangnya_lebih_dari_32_karakter

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backend and Prisma
        run: |
          pnpm shared:build
          pnpm --filter @bingo/backend exec prisma format --check
          pnpm --filter @bingo/backend exec prisma validate
          pnpm --filter @bingo/backend exec prisma generate
          pnpm --filter @bingo/backend exec prisma migrate deploy
          pnpm --filter @bingo/backend prisma:seed
          pnpm --filter @bingo/backend lint
          pnpm --filter @bingo/backend build
          pnpm --filter @bingo/backend test --runInBand
          pnpm --filter @bingo/backend test:e2e

      - name: Lint and typecheck mobile app
        run: |
          pnpm --filter @bingo/mobile lint
          pnpm --filter @bingo/mobile typecheck

      - name: Test mobile app
        run: pnpm --filter @bingo/mobile exec jest --runInBand

      - name: Export web dashboard
        env:
          EXPO_PUBLIC_WEB_BUILD: '1'
        run: pnpm --filter @bingo/mobile exec expo export --platform web --output-dir dist/web

      - name: Set CI version code
        run: echo "BINGO_ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate Android native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK with CI certificate
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Package CI APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/BinGo-ci-${GITHUB_SHA::7}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-ci-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
