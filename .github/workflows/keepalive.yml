name: Keep API awake

# Render free tier menidurkan service setelah 15 menit tanpa trafik, dan
# membangunkannya makan ~50 detik. Untuk demo juri itu fatal: mereka menatap
# layar kosong hampir semenit dan menyimpulkan aplikasinya rusak.
#
# Workflow ini menyentuh /health tiap 10 menit supaya service tidak pernah
# sempat tidur.
#
# Dua hal yang harus diketahui, bukan disembunyikan:
#
#   1. Cron GitHub Actions TIDAK tepat waktu. Pada jam sibuk ia bisa tertunda
#      5-15 menit, jadi sesekali service tetap sempat tidur. Ini mengurangi
#      peluang, bukan menghilangkannya.
#   2. Menjelang demo, sentuh sendiri /health lima menit sebelum mulai. Jangan
#      bergantung pada cron untuk momen yang menentukan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_BASE_URL belum diset — ping dilewati."
            exit 0
          fi
          # --max-time 90 karena bangun dari tidur memang selama itu; timeout
          # pendek akan melaporkan gagal padahal service sedang bangun normal.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_BASE_URL/health" || echo 000)
          echo "GET $API_BASE_URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check menjawab $code"
          fi
