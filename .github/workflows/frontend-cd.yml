name: Frontend CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-cd.yml'

permissions:
  contents: read

concurrency:
  group: frontend-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Variabel ini ditanam ke dalam bundel saat BUILD, bukan dibaca saat
      # runtime. Salah nilainya berarti harus build ulang — dan itulah persis
      # yang membuat produksi sempat memanggil IP LAN laptop pengembang.
      #
      # Karena itu tidak ada nilai bawaan diam-diam di sini. Lebih baik gagal
      # sekarang dengan pesan jelas daripada mengirim bundel yang tidak bisa
      # dipakai siapa pun.
      - name: Validate API base URL
        env:
          API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable EXPO_PUBLIC_API_BASE_URL belum diset."
            echo "Settings -> Secrets and variables -> Actions -> Variables."
            echo "Contoh: https://bingo-api.vercel.app"
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::EXPO_PUBLIC_API_BASE_URL harus https:// — nilai sekarang: $API_BASE_URL"
              echo "Web disajikan lewat HTTPS; permintaan HTTP diblokir peramban sebagai mixed content."
              exit 1
              ;;
          esac
          # Alamat privat tidak dapat dijangkau pengunjung mana pun.
          case "$API_BASE_URL" in
            *//10.*|*//192.168.*|*//127.*|*//localhost*|*//172.1[6-9].*|*//172.2[0-9].*|*//172.3[01].*)
              echo "::error::EXPO_PUBLIC_API_BASE_URL menunjuk alamat privat: $API_BASE_URL"
              exit 1
              ;;
          esac
          echo "API base URL: $API_BASE_URL"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]      && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]     && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_WEB_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diset:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_WEB_BUILD WAJIB diset di sini.
      #
      # `metro.config.js` hanya memasang shim web (expo-secure-store,
      # expo-camera, react-native-nfc-manager, dan terutama zustand) ketika
      # salah satu dari BINGO_WEB_QC / EXPO_PUBLIC_WEB_BUILD ada. Tanpa itu
      # Metro memilih kondisi `import` dari exports map zustand, menanam
      # `import.meta.env` ke dalam bundel script klasik, dan peramban menolak
      # seluruh bundel sebelum React sempat dirender — halaman putih total.
      #
      # Inilah yang terjadi di produksi: perbaikan 78eea00 ada di repo tapi
      # tidak pernah aktif di CI karena variabelnya tidak diset.
      - name: Build web bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_WEB_BUILD: '1'
        run: |
          pnpm shared:build
          pnpm --filter @bingo/mobile exec expo export --platform web --output-dir dist

      # Satu pemeriksaan, bukan grep ke seluruh bundel.
      #
      # Versi sebelumnya mencari alamat privat di mana pun di dalam bundel, dan
      # itu menolak bundel yang sehat: axios memuat literal 'http://localhost'
      # sebagai nilai bawaan `origin` miliknya sendiri. Mencari string di dalam
      # kode pihak ketiga tidak pernah bisa menjawab pertanyaan yang sebenarnya
      # diajukan — alamat mana yang akan DIPAKAI aplikasi.
      #
      # Skripnya membaca extra.apiBaseUrl dari manifest yang ditanam Expo, dan
      # sekaligus menolak bundel yang memuat import.meta (penyebab halaman putih).
      - name: Verify bundle
        working-directory: apps/mobile
        env:
          API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: node tools/verify-web-bundle.mjs dist "$API_BASE_URL"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel deploy dist` memperlakukan dist sebagai AKAR PROYEK, lalu
      # menjalankan build-nya sendiri dan mencari Output Directory bernama
      # "dist" di dalamnya. Tidak ada yang perlu dibangun dan folder itu tidak
      # ada, jadi deploy gagal meski bundelnya sudah jadi dan sudah lolos
      # verifikasi.
      #
      # Build Output API v3 menghindari seluruh persoalan itu: artefaknya
      # diserahkan sudah jadi, dan Vercel tidak membangun apa pun. Efek
      # sampingnya penting — pengaturan Framework/Build/Output di dashboard
      # tidak lagi ikut menentukan hasil, sehingga deploy tidak bisa lagi rusak
      # karena seseorang mengubah setelan proyek.
      - name: Package for Vercel (Build Output API)
        working-directory: apps/mobile
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          # `handle: filesystem` dulu, baru fallback ke index.html. Tanpa
          # urutan itu, setiap permintaan aset — termasuk bundel JS-nya
          # sendiri — akan dijawab index.html dan halaman kembali putih.
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/.*", "dest": "/index.html" }
            ]
          }
          JSON
          echo "Isi .vercel/output/static:"
          ls .vercel/output/static

      - name: Deploy to Vercel
        working-directory: apps/mobile
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed: $url"

      # Dua hal diperiksa, dan keduanya pernah gagal dengan cara berbeda.
      #
      # Pertama: MENUNGGU. `vercel deploy` kembali begitu deployment dibuat,
      # bukan begitu ia siap melayani permintaan. Memanggil URL-nya seketika
      # menghasilkan 404 dari deployment yang belum aktif — bukan dari rute
      # yang salah. Versi sebelumnya gagal persis begitu, dalam 0 detik.
      #
      # Kedua: DUA PERMINTAAN, bukan satu. `/login` membuktikan rewrite SPA
      # bekerja; bundel JS membuktikan `handle: filesystem` mendahuluinya.
      # Kalau hanya /login yang diperiksa, konfigurasi yang menjawab
      # index.html untuk SEMUA permintaan tetap lolos — dan itu persis bentuk
      # halaman putih yang sudah dua kali terjadi.
      - name: Smoke test
        run: |
          set -uo pipefail

          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$DEPLOY_URL/login" || echo 000)
            case "$code" in
              200) echo "siap setelah percobaan $attempt"; break ;;
              401|403)
                echo "::error::/login menjawab HTTP $code — Deployment Protection aktif di proyek Vercel ini."
                echo "Matikan di: Project Settings -> Deployment Protection."
                exit 1
                ;;
              *) echo "  percobaan $attempt: HTTP $code, menunggu"; sleep 5 ;;
            esac
          done
          if [ "$code" != "200" ]; then
            echo "::error::/login tetap menjawab HTTP $code setelah 30 percobaan."
            exit 1
          fi

          bundle=$(cd apps/mobile/dist && ls _expo/static/js/web/*.js | head -1)
          ctype=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 20 "$DEPLOY_URL/$bundle")
          echo "GET /$bundle -> $ctype"
          case "$ctype" in
            *javascript*) ;;
            *)
              echo "::error::Bundel JS dijawab sebagai '$ctype', bukan JavaScript."
              echo "Rewrite SPA menelan permintaan aset — halaman akan putih."
              exit 1
              ;;
          esac
          echo "Web OK: $DEPLOY_URL"
