name: APK CD

on:
  workflow_dispatch:
    inputs:
      apk_target:
        description: Target kompatibilitas APK
        required: true
        type: choice
        default: universal-arm
        options:
          - universal-arm
          - arm64
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_NO_GIT_STATUS: '1'
  EXPO_NO_DOTENV: '1'
  # Tanpa nilai cadangan. Cadangan sebelumnya menunjuk backend Vercel yang
  # sudah tidak dipakai, jadi APK rilis diam-diam dibangun memanggil alamat
  # mati. app.config.ts kini menghentikan build di CI bila variabel ini kosong.
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
  # Langkah validasi menjalankan `prisma generate` dan uji unit backend.
  # Keduanya tidak pernah menyentuh database, tetapi Prisma tetap menuntut
  # setiap env() di skema dapat diselesaikan dan berhenti dengan P1012 bila
  # tidak. Nilai di bawah ini sengaja jelas-jelas palsu supaya tidak ada yang
  # mengira rilis APK berbicara ke database sungguhan.
  DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused?schema=public
  DIRECT_URL: postgresql://unused:unused@127.0.0.1:5432/unused?schema=public
  JWT_SECRET: apk_cd_dummy_secret_yang_panjangnya_lebih_dari_32_karakter
  # Tag builds and manual builds default to broad physical-device support.
  # The ARM64 profile remains available when minimum download size matters.
  APK_TARGET: ${{ inputs.apk_target || 'universal-arm' }}

jobs:
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production API
        env:
          API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || { echo '::error::Missing repository variable EXPO_PUBLIC_API_BASE_URL'; exit 1; }
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::EXPO_PUBLIC_API_BASE_URL must use HTTPS: $API_BASE_URL"; exit 1 ;;
          esac
          case "$API_BASE_URL" in
            *localhost*|*127.0.0.1*|*10.*|*192.168.*|*172.16.*)
              echo "::error::EXPO_PUBLIC_API_BASE_URL points to a private address: $API_BASE_URL"
              exit 1
              ;;
          esac

          response=''
          for attempt in 1 2 3 4 5; do
            response=$(curl -fsS --max-time 90 "$API_BASE_URL/health" || true)
            if printf '%s' "$response" | jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            echo "Health check attempt $attempt did not return a usable response."
            sleep 5
          done
          printf '%s' "$response" | jq -e '.status == "ok"' >/dev/null || {
            echo "::error::Production API health check failed: $API_BASE_URL/health"
            exit 1
          }

      - name: Validate app and backend
        run: |
          pnpm shared:build
          pnpm --filter @bingo/backend exec prisma generate
          pnpm --filter @bingo/backend build
          pnpm --filter @bingo/backend test --runInBand
          pnpm --filter @bingo/mobile lint
          pnpm --filter @bingo/mobile typecheck
          pnpm --filter @bingo/mobile exec jest --runInBand

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BINGO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BINGO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BINGO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BINGO_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo '::error::Missing BINGO_ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo '::error::Missing BINGO_ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo '::error::Missing BINGO_ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::Missing BINGO_ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BINGO_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bingo-release.jks"

      # Workflow ini punya DUA pemicu, dan keduanya berperilaku berbeda.
      #
      # Pada tag `v*`, GITHUB_REF_NAME adalah tag itu dan hasilnya dirilis.
      # Pada workflow_dispatch, GITHUB_REF_NAME adalah nama branch — 'main' —
      # dan tidak ada rilis yang boleh dibuat. Sebelumnya perbedaan itu tidak
      # dibedakan sama sekali, sehingga dispatch mencoba merilis "main" dan
      # ditolak --verify-tag.
      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            # Build uji coba dari branch. Ditandai jelas supaya APK-nya tidak
            # pernah tertukar dengan rilis sungguhan.
            VERSION_NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "APK_LABEL=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BINGO_APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BINGO_ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Versi: $VERSION_NAME (ref_type=$GITHUB_REF_TYPE)"

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          BINGO_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bingo-release.jks
          BINGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BINGO_ANDROID_KEYSTORE_PASSWORD }}
          BINGO_ANDROID_KEY_ALIAS: ${{ secrets.BINGO_ANDROID_KEY_ALIAS }}
          BINGO_ANDROID_KEY_PASSWORD: ${{ secrets.BINGO_ANDROID_KEY_PASSWORD }}
        run: |
          case "$APK_TARGET" in
            universal-arm) REACT_NATIVE_ARCHS='arm64-v8a,armeabi-v7a' ;;
            arm64) REACT_NATIVE_ARCHS='arm64-v8a' ;;
            *) echo "::error::Unknown APK target: $APK_TARGET"; exit 1 ;;
          esac
          echo "Building $APK_TARGET for $REACT_NATIVE_ARCHS"
          ./gradlew :app:assembleRelease --no-daemon \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHS" \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Verify and rename APK
        id: package
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          SOURCE_APK='apps/mobile/android/app/build/outputs/apk/release/app-release.apk'
          SIGNING_REPORT="$RUNNER_TEMP/apk-signing.txt"
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK" | tee "$SIGNING_REPORT"
          ! grep -Fq 'CN=Android Debug' "$SIGNING_REPORT" || {
            echo '::error::Release APK was signed with the Android debug certificate.'
            exit 1
          }
          "$ZIPALIGN" -c -P 16 -v 4 "$SOURCE_APK"

          BADGING="$("$AAPT" dump badging "$SOURCE_APK" | head -1)"
          printf '%s\n' "$BADGING"
          printf '%s' "$BADGING" | grep -Fq "package: name='id.bingo.app'" || {
            echo '::error::Unexpected Android application ID.'
            exit 1
          }

          EMBEDDED_API=$(unzip -p "$SOURCE_APK" assets/app.config | jq -er '.extra.apiBaseUrl')
          test "$EMBEDDED_API" = "$EXPO_PUBLIC_API_BASE_URL" || {
            echo "::error::APK contains API URL '$EMBEDDED_API', expected '$EXPO_PUBLIC_API_BASE_URL'."
            exit 1
          }
          case "$EMBEDDED_API" in
            https://*) ;;
            *) echo "::error::APK API URL is not HTTPS: $EMBEDDED_API"; exit 1 ;;
          esac

          APK_ABIS=$(unzip -Z1 "$SOURCE_APK" | awk -F/ '/^lib\// { print $2 }' | sort -u | paste -sd, -)
          case "$APK_TARGET" in
            universal-arm)
              test "$APK_ABIS" = 'arm64-v8a,armeabi-v7a' || {
                echo "::error::Universal ARM APK contains unexpected ABIs: $APK_ABIS"
                exit 1
              }
              ;;
            arm64)
              test "$APK_ABIS" = 'arm64-v8a' || {
                echo "::error::ARM64 APK contains unexpected ABIs: $APK_ABIS"
                exit 1
              }
              ;;
          esac

          mkdir -p dist
          APK_NAME="BinGo-${APK_LABEL}-${APK_TARGET}.apk"
          cp "$SOURCE_APK" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          APK_BYTES=$(stat -c '%s' "dist/$APK_NAME")
          APK_MIB=$(awk "BEGIN { printf \"%.2f\", $APK_BYTES / 1048576 }")
          echo "Verified APK: $APK_NAME ($APK_MIB MiB), API=$EMBEDDED_API"
          echo "apk_path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=dist/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_mib=$APK_MIB" >> "$GITHUB_OUTPUT"
          echo "apk_abis=$APK_ABIS" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-release-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Summarize APK
        run: |
          {
            echo '## BinGo Android APK'
            echo
            echo "- File: \`${{ steps.package.outputs.apk_name }}\`"
            echo "- Size: ${{ steps.package.outputs.apk_mib }} MiB"
            echo "- Target: $APK_TARGET"
            echo "- ABI: ${{ steps.package.outputs.apk_abis }}"
            echo "- API: \`$EXPO_PUBLIC_API_BASE_URL\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 '${{ steps.package.outputs.checksum_path }}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Hanya pada tag. Pada dispatch, APK-nya tetap tersedia sebagai artifact
      # di atas — yang tidak boleh terjadi adalah membuat rilis dari branch.
      - name: Publish GitHub Release asset
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.package.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$APK_PATH#BinGo Android APK ($APK_TARGET)" \
              "$CHECKSUM_PATH#SHA-256 checksum" \
              --verify-tag \
              --generate-notes
          fi
