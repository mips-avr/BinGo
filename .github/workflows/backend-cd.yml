name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-cd.yml'

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy backend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Dicek lebih dulu supaya kegagalan konfigurasi muncul dalam 20 detik,
      # bukan setelah lima menit build.
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ]         && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ]        && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ]    && missing="$missing VERCEL_BACKEND_PROJECT_ID"
          [ -z "$MIGRATE_DATABASE_URL" ] && missing="$missing MIGRATE_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Secret belum diset:$missing"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (validasi sebelum deploy)
        run: |
          pnpm shared:build
          pnpm --filter @bingo/backend exec prisma generate
          pnpm --filter @bingo/backend build

      # Migrasi dijalankan SEBELUM deploy, dan memakai koneksi LANGSUNG Neon,
      # bukan yang pooled. PgBouncer milik Neon tidak mendukung statement
      # advisory lock yang dipakai Prisma untuk mengunci migrasi, sehingga lewat
      # koneksi pooled perintah ini menggantung sampai timeout.
      #
      # Urutannya juga disengaja: kalau migrasi gagal, kode lama tetap melayani
      # trafik. Deploy dulu baru migrasi akan membuat kode baru bertemu skema
      # lama selama beberapa detik.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: pnpm --filter @bingo/backend exec prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `--prebuilt` adalah kuncinya, dan itu sekaligus menyelesaikan masalah
      # monorepo. Build dikerjakan DI SINI, di runner, tempat seluruh repo
      # sudah ter-checkout — jadi `cd ../..` pada installCommand dan
      # buildCommand di vercel.json menemukan paket workspace dengan benar.
      # Yang diunggah ke Vercel hanya .vercel/output yang sudah jadi.
      #
      # Cara lama `vercel --cwd apps/backend` gagal justru karena kebalikannya:
      # build dikerjakan di Vercel dari isi folder yang diunggah saja, sehingga
      # @bingo/shared-types dan kawan-kawan tidak pernah ikut terkirim.
      - name: Deploy to Vercel
        working-directory: apps/backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"
          echo "Deployed: $url"

      # Deploy yang "berhasil" tetapi menjawab 500 pada permintaan pertama adalah
      # kegagalan yang paling mahal, karena baru ketahuan saat orang mencoba
      # masuk. Diperiksa di sini.
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.txt -w '%{http_code}' "$DEPLOY_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Health OK: $(cat /tmp/health.txt)"
              exit 0
            fi
            echo "Percobaan $i: HTTP $code — menunggu cold start…"
            sleep 6
          done
          echo "::error::/health tidak menjawab 200 setelah 5 percobaan. Respons terakhir:"
          cat /tmp/health.txt || true
          exit 1
